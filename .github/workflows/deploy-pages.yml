name: Deploy Unity WebGL to Pages

on:
  push:
    branches:
      - main
    paths:
      - "*-default-webgl-*.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Unity WebGL build
        id: build
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*-default-webgl-*.zip' -printf '%f\n' | sort -V | tail -n1)"
          test -n "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Extract Unity WebGL build
        run: |
          set -euo pipefail
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q "${{ steps.build.outputs.zip }}" -d extracted
          INDEX="$(find extracted -type f -name index.html -print -quit)"
          test -n "$INDEX"
          SITE_ROOT="$(dirname "$INDEX")"
          cp -a "$SITE_ROOT/." _site/

          python3 - <<'PY'
          from pathlib import Path
          p = Path("_site/index.html")
          s = p.read_text()
          needle = '      window.addEventListener("error",function(e){'
          inject = '''      const originalConsoleError=console.error.bind(console);
      console.error=function(){
        originalConsoleError.apply(console,arguments);
        mark("CONSOLE ERROR: "+Array.from(arguments).map(text).join(" "),"err");
      };
      const originalConsoleWarn=console.warn.bind(console);
      console.warn=function(){
        originalConsoleWarn.apply(console,arguments);
        mark("CONSOLE WARN: "+Array.from(arguments).map(text).join(" "),"warn");
      };
'''
          if needle not in s:
              raise SystemExit("diagnostic injection point not found")
          s = s.replace(needle, inject + needle, 1)
          p.write_text(s)
          PY

          touch _site/.nojekyll
          test -f _site/index.html
          find _site/Build -type f -name '*.loader.js' -print -quit | grep -q .
          find _site/Build -type f -name '*.wasm' -print -quit | grep -q .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
