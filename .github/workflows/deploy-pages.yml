name: Deploy Unity WebGL to Pages

on:
  push:
    branches:
      - main
    paths:
      - "*-default-webgl-*.zip"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Unity WebGL build
        id: build
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*-default-webgl-*.zip' -printf '%f\n' | sort -V | tail -n1)"
          test -n "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Using $ZIP"

      - name: Extract Unity WebGL build
        run: |
          set -euo pipefail
          rm -rf _site extracted
          mkdir -p _site extracted
          unzip -q "${{ steps.build.outputs.zip }}" -d extracted
          INDEX="$(find extracted -type f -name index.html -print -quit)"
          test -n "$INDEX"
          SITE_ROOT="$(dirname "$INDEX")"
          cp -a "$SITE_ROOT/." _site/
          touch _site/.nojekyll
          test -f _site/index.html
          find _site/Build -type f -name '*.loader.js' -print -quit | grep -q .
          find _site/Build -type f -name '*.wasm' -print -quit | grep -q .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
